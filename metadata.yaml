name: astrbot_plugin_mindscape
display_name: 灵魂景观 Mindscape
short_desc: 给 bot 补上认知、表达、沉浸、唤醒四层能力
desc: |
  四层能力，配置独立于框架（`~/.mindscape/config.yaml`，自带桌面版与网页版管理界面）。

  - **认知层**：五层记忆装配（规矩 / 账本 / 风格 / 摘要 / 原文），带字数预算，
    超预算时从最不重要的层开始砍。没有用向量库 —— 取舍理由是角色 bot 需要
    「按时间发生的事」，而不是「和当前话题最相似的片段」。
  - **表达层**：表情包采集（视觉模型判契合度）+ 按语境选图 + 斗图队形。
  - **沉浸层**：报错拦截 / 输出规范化 / 空回复救援，以及**沉默** ——
    不想说话时只输出一个标记，发送前整条回复被清空，那一轮群里没有任何消息。
  - **唤醒层**：@必回、正文提到名字必回、定向性判定、自主冒泡（抽签制，不是整点）。

  主仓库（源码 / 文档 / 唤醒层补丁）：https://github.com/Illusory-moon/bot-mindscape
version: 0.1.0
author: Illusory-moon
