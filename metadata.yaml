name: astrbot_plugin_mindscape
display_name: 灵魂景观 Mindscape
short_desc: 别人在做让它更能说，这个在做让它知道什么时候别说
desc: |
  **先说清楚：这和其他记忆插件不是一个位置的产品。**

  AstrBot 的记忆生态已经很成熟 —— 有做完整记忆生命周期的，有上向量库混合检索的，
  有做人格演化的。**要「最深的记忆」，请直接用它们。**

  灵魂景观补的是反方向的那一半：**什么时候别说。**

  - **沉默权**：它真的可以什么都不发。不是发一句「（安静飘过）」假装沉默，
    而是那一轮群里**没有任何消息**
  - **防出戏**：框架报错、只有思考过程的空回复 —— 拦在发送前，绝不出现在群里
  - **定向性判定**：分得清「这话是不是在跟我说」，别人被 @ 时不会乱应
  - **自主冒泡**：抽签制自己开口，不是整点、不刷屏，错过的名额不补

  另外附带三层（不是主打，但都在）：
  - 认知层：五层记忆装配（规矩 / 账本 / 风格 / 摘要 / 原文），带字数预算。
    刻意**不用向量库** —— 角色 bot 要的是「按时间发生的事」，不是「最相似的片段」
  - 表达层：表情包采集（视觉模型判契合度）+ 按语境选图
  - 运维：配置独立于框架（`~/.mindscape/config.yaml`），自带桌面版与网页版管理界面

  主仓库（源码 / 文档 / 唤醒层补丁）：https://github.com/Illusory-moon/bot-mindscape
version: 0.1.0
author: Illusory-moon
